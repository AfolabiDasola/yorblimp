[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "yorblimp"
version = "0.1.0"
description = "Tools for a benchmark of Yorùbá grammatical minimal pairs"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
keywords = ["yoruba", "minimal pairs", "benchmark", "syntax", "language models", "low-resource"]

[project.optional-dependencies]
score = ["torch", "transformers"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
